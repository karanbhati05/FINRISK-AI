# FinRisk AI Configuration

data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  dataset_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/00350/default%20of%20credit%20card%20clients.xls"
  dataset_filename: "credit_default.csv"
  target_column: "default"

model:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"

  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 3.5
    random_state: 42
    eval_metric: "auc"
    use_label_encoder: false

training:
  early_stopping_rounds: 20
  validation_fraction: 0.1

api:
  host: "0.0.0.0"
  port: 8000
  title: "FinRisk AI API"
  version: "0.1.0"
  reload: true

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "finrisk-credit-default"
  artifact_location: "mlruns/artifacts"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dir: "logs"
